security:
    password_hashers:
        App\Security\User: auto
    providers:
        utilisateurs:
            id: App\Security\UserProvider
    firewalls:
        mobile:
            pattern: ^/api/mobile
            security: false
        main:
            lazy: true
            provider: utilisateurs
            user_checker: App\Security\UserChecker
            form_login:
                login_path: connexion
                check_path: connexion
                enable_csrf: true
                default_target_path: accueil
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: deconnexion
                target: connexion
                enable_csrf: true
    access_control:
        - { path: '^/connexion$', roles: PUBLIC_ACCESS }
        - { path: '^/', roles: ROLE_USER }
